name: Build Android APK

# Builds the same dist/ the Electron and Pages builds ship, wrapped as a
# Capacitor Android app, and attaches the resulting .apk to the matching
# GitHub Release — the Android counterpart to scripts/publish-release.cjs's
# Electron publish. Runs here (not locally) because this machine has no
# Android SDK/JDK/Gradle installed.
#
# Debug-signed for now (no production keystore configured yet) — installable
# by sideloading, Android will show the standard "unknown source" warning.
# Production signing is a deliberate follow-up, not done here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # This job never touches Electron — skip the ~100MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web bundle
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Capacitor 8's generated capacitor.build.gradle pins sourceCompatibility/
          # targetCompatibility to VERSION_21 — javac on an older JDK rejects that
          # with "invalid source release: 21", which is what broke the first 3 runs.
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        # Belt-and-suspenders: the executable bit is now committed too, but a
        # future commit from a Windows checkout could silently drop it again
        # (exactly what caused the first run's exit-126 failure) — this step
        # makes the build immune to that regardless of what git tracked.
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-output.log

      - name: Show Gradle failure details
        # Raw step logs need repo-admin sign-in to view (confirmed while
        # debugging this workflow), so a failure here would otherwise be a
        # dead end to diagnose. $GITHUB_STEP_SUMMARY is public on this repo's
        # run page without sign-in — dump the actual Gradle error there.
        if: steps.gradle_build.outcome == 'failure'
        working-directory: android
        run: |
          {
            echo '### Gradle build failed — last 200 lines'
            echo '```'
            tail -n 200 gradle-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyx-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
