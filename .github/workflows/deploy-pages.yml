name: Deploy PWA to GitHub Pages

# Builds the web/PWA version and publishes it to GitHub Pages.
# The same dist/ that Electron ships is served here — HashRouter + relative
# asset paths mean it works unchanged at the /studyx-app/ subpath.

on:
  push:
    branches: [main]
    # Skip pointless rebuilds for changes that don't affect the web build.
    paths-ignore:
      - 'electron/**'
      - 'release/**'
      - 'studyx-updates/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy cancel an in-progress one, but never interrupt a live run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # The web build never runs Electron — skip the ~100MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
